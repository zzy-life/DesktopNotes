name: Build

on:
  push:
    branches:
      - master
  pull_request:

jobs:
   build-and-upload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET Framework
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Build
        run: msbuild "./Desktop Notes/Desktop Notes/Desktop Notes.csproj" /p:Configuration=Release /p:Platform="AnyCPU"
        shell: powershell


      - name: Create installer
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.Util.wixext/4.0.5
          wix build Product.wxs -ext WixToolset.Util.wixext -o "./Desktop Notes/Desktop Notes/bin/Release/Desktop_Notes.msi"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktop Notes
          path: "Desktop Notes/Desktop Notes/bin/Release/**"

      - name: Package Release as ZIP
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: Compress-Archive -Path "Desktop Notes/Desktop Notes/bin/Release/*" -DestinationPath "Desktop_Notes.zip"
        shell: powershell

      - name: Update latest Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Build
          prerelease: true
          make_latest: false
          files: Desktop_Notes.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      

