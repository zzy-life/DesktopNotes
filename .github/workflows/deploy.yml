name: Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  deploy:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET Framework
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '6.0.x'  

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v1.1  

      - name: Build
        run: msbuild "./Desktop Notes/Desktop Notes/Desktop Notes.csproj" /p:Configuration=Release /p:Platform="AnyCPU"
        shell: powershell
        

      - name: Create installer
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix build Product.wxs -o "./Desktop Notes/Desktop Notes/bin/Release/Desktop_Notes.msi"
        
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Desktop Notes
          path: "Desktop Notes/Desktop Notes/bin/Release/**"

      - name: Package Release as ZIP
        run: Compress-Archive -Path "Desktop Notes/Desktop Notes/bin/Release/*" -DestinationPath "Desktop_Notes.zip"
        shell: powershell

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: Desktop_Notes.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
